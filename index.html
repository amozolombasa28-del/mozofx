<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mozofx | Powered by Deriv</title>
  <meta name="description" content="mozofx is an independent trading platform in partnership with Deriv.">
  <style>
    :root { --bg:#000000; --card:#111111; --text:#f5f5f5; --muted:#a3a3a3; --line:#222; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.55; }
    header, main, footer { max-width:1000px; margin:0 auto; padding:1.25rem; }
    header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
    .logo { font-weight:700; font-size:1.35rem; letter-spacing:.04em; }
    .powered { font-size:.85rem; color:var(--muted); }
    .hero { padding:4rem 0 2rem; text-align:center; }
    h1 { font-size:clamp(1.9rem,4vw,3rem); margin-bottom:.8rem; }
    .sub { color:var(--muted); max-width:640px; margin:0 auto 1.5rem; }
    .cta { display:inline-block; background:#fff; color:#000; text-decoration:none; padding:.95rem 1.6rem; border-radius:8px; font-weight:700; margin:.35rem; }
    .cta.alt { background:transparent; color:#fff; border:1px solid #333; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1rem; margin:2rem 0; }
    .card { background:var(--card); padding:1.25rem; border-radius:12px; border:1px solid var(--line); }
    h2 { margin:1.6rem 0 .7rem; }
    ul { margin-left:1.2rem; color:var(--muted); }
    li { margin:.35rem 0; }
    .risk { font-size:.8rem; color:var(--muted); margin-top:2rem; }
    footer { border-top:1px solid var(--line); color:var(--muted); font-size:.85rem; }
  </style>
</head>
